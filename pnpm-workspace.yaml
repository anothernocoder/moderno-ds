packages:
  - "packages/*"
  - "tooling/*"
  - "apps/*"

allowBuilds:
  esbuild: true
  sharp: false
  # Its postinstall only sends telemetry (ADR-0011).
  "@openuidev/lang-core": false

# Astro (apps/docs) pulls vite 8; the framework test toolchains
# (vite-plugin-solid/svelte/vue) are on vite 6. Pin the shared vitest toolchain
# to vite 6 so a single vite type instance reaches each package's
# vitest.config.ts — astro keeps its own vite 8.
#
# Every version-scoped key below (`pkg@N>dep`) must name a version that is
# actually in the tree: pnpm does not error on an override that matches nothing,
# so a key scoped to a version the lockfile no longer has looks applied and is
# not. Check the lockfile after any upgrade that moves these.
overrides:
  vitest>vite: "6.4.5"
  "@vitest/mocker>vite": "6.4.5"
  vite-plugin-solid>vite: "6.4.5"
  "@vitejs/plugin-vue>vite": "6.4.5"
  # @moderno-ui/svelte tests on the v5 plugin (vite 6); @astrojs/svelte pulls the
  # v7 plugin (vite 8). Version-scope so each resolves a single matching vite.
  "@sveltejs/vite-plugin-svelte@5>vite": "6.4.5"
  # Astro's toolchain pulls @types/node 24; pin to one version so a single
  # vite type instance is shared (avoids vite6-node22 vs vite6-node24 clashes).
  "@types/node": "22.19.21"
  # GHSA-23hp-3jrh-7fpw: node-tar decompression DoS, pulled transitively by
  # @astrojs/vercel -> @vercel/nft -> @mapbox/node-pre-gyp.
  tar: ">=7.5.19"
  # GHSA-9wv6-86v2-598j: path-to-regexp ReDoS. @vercel/routing-utils pins 6.1.0
  # exactly, and its latest release still does.
  "@vercel/routing-utils>path-to-regexp": "6.3.0"
  # GHSA-mrhx-c7xc-m3w5: zod memory exhaustion. @vercel/cli-config pins 4.1.11
  # exactly, and its latest release still does.
  "@vercel/cli-config>zod": "4.6.7"
  # GHSA-g7r4-m6w7-qqqr: esbuild. tsup 8.5 asks for ^0.27 and the fix is in 0.28.1.
  tsup>esbuild: "0.28.2"
  # GHSA-3g3m-2fjr-6pw4: glob keeps walking after an abort. @vercel/nft and
  # js-beautify ask for ^13 and the fix is only in 14.
  "glob@13": "14.0.2"

onlyBuiltDependencies:
  - esbuild
