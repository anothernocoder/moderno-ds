name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run it makes stale. On main every run has a
# group of its own, so none is ever cancelled, in progress or pending.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# OpenUI (@moderno-ui/genui) sends telemetry unless this is set (ADR-0011).
env:
  OPENUI_TELEMETRY_DISABLED: "1"

jobs:
  # A job of its own: neither tool needs a build, so this reports in a minute or
  # two, and a formatting error never hides what `checks` would find. Required
  # by branch protection under this name (docs/branch-protection.md).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 (apps/docs) requires >=22.12; the range keeps CI on the
          # latest 22 LTS patch rather than pinning one that ages out.
          node-version: "^22.12"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format

  # `checks` and `test` build every package but the docs: nothing they run reads
  # apps/docs/dist, and each e2e shard builds the docs anyway, so a broken docs
  # build still fails the run.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 (apps/docs) requires >=22.12; the range keeps CI on the
          # latest 22 LTS patch rather than pinning one that ages out.
          node-version: "^22.12"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every generated file is committed (ADR-0009): fail before the build if
      # one is stale or was edited by hand.
      - run: pnpm gen --check
      - run: pnpm -r --filter '!@moderno-ui/docs' build
      # The registry is what consumers copy: a block that hardcodes a colour or
      # a dimension never reaches them (ADR-0005, CONTRACT.md "Responsive
      # policy"). Needs the build above — the CLI runs on @moderno-ui/lint-core.
      - run: pnpm lint:registry
      # theme:build rewrites the committed theme outputs, so the freshness tests
      # would pass on a stale theme; a diff here is what catches it.
      - run: pnpm theme:build
      - run: git diff --exit-code
      - run: pnpm docs:parity
      - run: pnpm agent:check-drift
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 (apps/docs) requires >=22.12; the range keeps CI on the
          # latest 22 LTS patch rather than pinning one that ages out.
          node-version: "^22.12"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Many suites import workspace packages through their built entries.
      - run: pnpm -r --filter '!@moderno-ui/docs' build
      - run: pnpm test --shard=${{ matrix.shard }}/2

  # Docs end-to-end: build the docs, then assert facts about the build — the
  # sidebar's contents, that every island hydrates, and which CSS rule wins
  # inside a live `<Preview>` panel. Text and computed styles only, so nothing
  # here is host-dependent; the pinned Playwright image is just a browser that
  # matches `@playwright/test` in apps/docs/package.json (bump them together).
  e2e:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 (apps/docs) requires >=22.12; the range keeps CI on the
          # latest 22 LTS patch rather than pinning one that ages out.
          node-version: "^22.12"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm theme:build
      # The suite serves dist/, so the docs (and the packages they render) must
      # be built first — Pagefind index included, since the search UI is part of
      # every page it loads.
      - run: pnpm --filter @moderno-ui/docs... build
      - run: pnpm docs:e2e --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/docs/test-results
          if-no-files-found: ignore
          retention-days: 14
