name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The registry is what consumers copy: a block that hardcodes a colour or
      # a dimension never reaches them (ADR-0005, CONTRACT.md "Responsive
      # policy"). Needs the build above — the CLI runs on @moderno-ui/lint-core.
      - run: pnpm lint:registry
      - run: pnpm theme:build
      - run: pnpm docs:parity
      - run: pnpm agent:check-drift
      - run: pnpm typecheck
      - run: pnpm test

  # Visual regression: build the docs, then compare every preview page against
  # the committed baselines. Runs in the pinned Playwright image because
  # screenshots are only reproducible inside the environment that rendered them
  # — the same image `visual-baselines.yml` regenerates the baselines in. Bump
  # this tag and `@playwright/test` in apps/docs/package.json together.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm theme:build
      # The suite serves dist/, so the docs (and the packages they render) must
      # be built first — Pagefind index included, since the search UI is part of
      # every captured page.
      - run: pnpm --filter @moderno-ui/docs... build
      - run: pnpm docs:visual
      # Expected/actual/diff triptych for every page that moved.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: apps/docs/test-results
          retention-days: 14
      # A page with no baseline yet (a brand-new docs page) still fails the run,
      # but Playwright writes the screenshot it would have compared against.
      # Copying *that page's files* out of this artifact is how it joins the
      # matrix — never the whole directory, which would revert baselines merged
      # since this branch's base. A changed page needs `pnpm docs:visual:update`
      # instead (`--only <name>` to keep it to the pages that actually moved).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/docs/tests/visual/__screenshots__/linux
          if-no-files-found: ignore
          retention-days: 14
