name: Visual baselines

# Regenerate the committed screenshots of the docs preview pages.
#
# Baselines belong to the environment that rendered them, so they are produced
# here — in the same container the CI `visual` job compares against — and never
# on a maintainer's machine. Dispatch this from the branch that carries the
# visual change (`pnpm docs:visual:update` does the dispatch, the wait and the
# download for you), then commit the artifact into
# `apps/docs/tests/visual/__screenshots__/linux/`.

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      # Keep in lockstep with `.github/workflows/ci.yml` and the pinned
      # `@playwright/test` version in apps/docs/package.json.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm theme:build
      - run: pnpm --filter @moderno-ui/docs... build
      # Rewrites every baseline, including ones that already matched, so the
      # artifact is the complete set. Failures here are the point of the run,
      # not a reason to withhold the screenshots.
      - run: pnpm docs:visual --update-snapshots=all
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: apps/docs/tests/visual/__screenshots__/linux
          if-no-files-found: error
          retention-days: 14
