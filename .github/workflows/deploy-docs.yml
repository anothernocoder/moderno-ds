name: Deploy Docs

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # This job builds apps/docs too, so it carries Astro 7's floor.
          node-version: "^22.12"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm theme:build
      - name: Build docs for GitHub Pages
        run: pnpm --filter @moderno-ui/docs... build
        env:
          GH_PAGES: "true"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
